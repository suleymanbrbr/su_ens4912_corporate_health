name: CI

# Runs on every push to main and on every pull request targeting main.
# Installs the backend Python dependencies, performs an import-time smoke
# test on api_server, then executes the database-free unit tests
# (auth utilities + Pydantic model validation). ML-heavy unit tests
# (RAG engine, embeddings) and integration tests are skipped here — they
# require a live Postgres+pgvector instance and are run locally / on HF.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so PR force-pushes don't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt', 'tests/requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Upgrade pip tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install backend + test dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Generate ephemeral CI secrets
        # JWT_SECRET_KEY: random 64-char hex string, only valid for this run.
        # API_KEY_ENCRYPTION_KEY: a freshly-generated Fernet key.
        # GEMINI_API_KEY: dummy placeholder — module-level validation only.
        run: |
          echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
          echo "API_KEY_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
          echo "GEMINI_API_KEY=ci-dummy-key" >> "$GITHUB_ENV"

      - name: Import smoke test (api_server)
        working-directory: backend
        run: python -c "import api_server; print('api_server imports OK')"

      - name: Run database-free unit tests
        # test_rag_engine.py and test_embedding_utils.py are intentionally
        # excluded — they require langchain_huggingface + sentence-transformers
        # network downloads which are slow and flaky in CI.
        working-directory: tests
        run: |
          python -m pytest \
            unit/test_auth_utils.py \
            unit/test_api_models.py \
            -v --tb=short
